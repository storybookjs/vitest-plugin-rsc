packages:
  - "packages/*"
  - "playground/**"
  # Packages that a playground installs as they would be from npm.
  - "!playground/**/fixtures/**"
  - "conformance"
allowBuilds:
  # The watcher of Sass's CLI, which the conformance runner does not use.
  "@parcel/watcher": false
  # Not the download of Prisma's engines on every install: nextjs-db-recipes
  # needs them only for `prisma migrate diff`, as a Prisma schema changes.
  "@prisma/engines": false
  esbuild: true
  msw: true
  prisma: false
  sharp: true
patchedDependencies:
  "@electric-sql/pglite@0.5.10": patches/@electric-sql__pglite@0.5.10.patch
