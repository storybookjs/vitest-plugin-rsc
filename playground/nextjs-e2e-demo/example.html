<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Host: an example</title>
  </head>
  <body>
    <div id="host-root"></div>
    <!-- The host's runtime, which is no file of the host: see host/example.tsx. -->
    <script type="module">
      import { loadClientModule } from "vitest-plugin-rsc/nextjs/client-components";
      import * as example from "/host/example.tsx";

      try {
        const { renderExample } = await loadClientModule(example);
        renderExample(document.getElementById("host-root"));
        window.__hostState = "ready";
      } catch (error) {
        window.__hostState = "error";
        window.__hostError = error;
        console.error(error);
      }
    </script>
  </body>
</html>
