name: Chromatic

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The Storybook of the notes demo, built against the built packages as the
  # Test job tests them.
  notes-demo:
    name: Notes demo Storybook
    # A pull request from a fork has no secrets, so no project token.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Chromatic finds the baseline of a build in the history of its commit,
      # which for a pull request is the head commit, not GitHub's merge commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the Storybook
        working-directory: playground/nextjs-notes-demo
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: pnpm exec storybook build --output-dir storybook-static
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: playground/nextjs-notes-demo
          storybookBuildDir: storybook-static
          onlyChanged: false
          # A change waits for review in Chromatic, not in a red check.
          exitZeroOnChanges: true
          # What lands on main is the baseline.
          autoAcceptChanges: main
