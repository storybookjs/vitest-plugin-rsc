name: CI probe

on:
  pull_request:

jobs:
  vitest:
    name: Test (vitest, ${{ matrix.part }}, ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
        part: [host demo, notes demo Storybook]
        include:
          - part: host demo
            projects: --project 'nextjs-host-demo*'
          - part: notes demo Storybook
            projects: --project 'nextjs-notes-demo-storybook*'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - run: pnpm test:dist ${{ matrix.projects }}
