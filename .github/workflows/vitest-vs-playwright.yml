name: Vitest vs Playwright

# The 25 tests of playground/vitest-vs-playwright, in Vitest with
# `renderServer()` and in Playwright on Postgres in Docker, each with 1
# worker: Vitest in development against `next dev`, Vitest in production
# against `next build` and `next start`. See its README.md. Each job writes what its
# steps took to the summary of the run.
on:
  pull_request:
    paths:
      - playground/vitest-vs-playwright/**
      - packages/vitest-plugin-rsc/**
      - .github/workflows/vitest-vs-playwright.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# With pipefail, so that a test that fails fails the step, through `tee`.
defaults:
  run:
    shell: bash
    working-directory: playground/vitest-vs-playwright

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter vitest-plugin-rsc build
      - name: Run the 25 tests, Next and React in production
        run: |
          start=$(date +%s.%N)
          pnpm exec vitest run --maxWorkers 1 | tee vitest.log
          end=$(date +%s.%N)
          duration=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -oP 'Duration\s+\K[0-9.]+')
          {
            echo "### Vitest, production"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| 25 tests, 1 worker, all included | %.1f |\n" "$(echo "$end - $start" | bc)"
            printf "| Of which Vitest's own Duration | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the 25 tests, Next and React in development
        env:
          VITEST_PLUGIN_RSC_BUILD: development
        run: |
          start=$(date +%s.%N)
          pnpm exec vitest run --maxWorkers 1 | tee vitest.log
          end=$(date +%s.%N)
          duration=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -oP 'Duration\s+\K[0-9.]+')
          {
            echo "### Vitest, development"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| 25 tests, 1 worker, all included | %.1f |\n" "$(echo "$end - $start" | bc)"
            printf "| Of which Vitest's own Duration | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Start Postgres in Docker, in RAM
        run: |
          start=$(date +%s.%N)
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql/data \
            postgres:17 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          until docker exec postgres pg_isready -U postgres -h localhost; do sleep 0.2; done
          end=$(date +%s.%N)
          echo "DATABASE_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
      - name: Run the 25 tests against next dev
        env:
          PLAYWRIGHT_SERVER: dev
        run: |
          start=$(date +%s.%N)
          pnpm exec playwright test | tee playwright.log
          end=$(date +%s.%N)
          duration=$(grep -oP 'passed \(\K[0-9.]+(?=s\))' playwright.log)
          {
            echo "### Playwright, development"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| Postgres in Docker | %.1f |\n" "$DATABASE_SECONDS"
            printf "| 25 tests, 1 worker, \`next dev\` included | %.1f |\n" "$(echo "$end - $start" | bc)"
            printf "| Of which Playwright's own time | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the app with next build
        run: |
          start=$(date +%s.%N)
          pnpm build
          end=$(date +%s.%N)
          echo "BUILD_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
      - name: Run the 25 tests against next start
        run: |
          start=$(date +%s.%N)
          pnpm exec playwright test | tee playwright.log
          end=$(date +%s.%N)
          duration=$(grep -oP 'passed \(\K[0-9.]+(?=s\))' playwright.log)
          {
            echo "### Playwright, production"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| \`next build\` | %.1f |\n" "$BUILD_SECONDS"
            printf "| 25 tests, 1 worker, \`next start\` included | %.1f |\n" "$(echo "$end - $start" | bc)"
            printf "| Of which Playwright's own time | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
