name: Vitest vs Playwright

# The same tests of two apps, each in Vitest with `renderServer()` and in
# Playwright on Postgres in Docker, with 1 worker: Vitest in development
# against `next dev`, Vitest in production against `next build` and
# `next start`. playground/vitest-vs-playwright is a todo app with 25 tests,
# playground/vitest-vs-playwright-notes a notes app with accounts and 500
# tests: see their README.md. Each job writes what its steps took to the
# summary of the run, and every test with its time to its log; the job
# `summary` puts the runs of every job in one table, by app.
#
# A pull request runs it when it changes what the numbers or the tests
# depend on: the two apps and the vite-cache.ts they import, dom-locators,
# the plugin and its build (not their unit tests), the dependencies, Node.js,
# or this workflow. Not for a change of docs, of a .md file or of another
# playground: a run takes about 40 minutes of runners. Any other change can
# run it by hand, once the workflow is on main.
on:
  pull_request:
    paths:
      - playground/vitest-vs-playwright/**
      - playground/vitest-vs-playwright-notes/**
      - "!playground/vitest-vs-playwright*/**/*.md"
      - playground/test-helpers/vite-cache.ts
      - packages/dom-locators/src/**
      - packages/dom-locators/package.json
      - packages/dom-locators/tsconfig.json
      - packages/vitest-plugin-rsc/src/**
      - "!packages/vitest-plugin-rsc/src/**/*.test.ts"
      - "!packages/vitest-plugin-rsc/src/**/*.test.tsx"
      - packages/vitest-plugin-rsc/package.json
      - packages/vitest-plugin-rsc/tsdown.config.ts
      - packages/vitest-plugin-rsc/tsconfig.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - .nvmrc
      - .github/workflows/vitest-vs-playwright.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# With pipefail, so that a test that fails fails the step, through `tee`.
defaults:
  run:
    shell: bash

jobs:
  vitest:
    name: Vitest, ${{ matrix.app }}, ${{ matrix.tests }}${{ matrix.mode == 'fast' && ', fast mode' || '' }}${{ matrix.node && ', on Node.js' || '' }}${{ matrix.dom && format(', Node host, {0}', matrix.dom) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tests/vitest/ clicks and fills with Vitest's commands, which
        # Playwright carries out; tests/vitest-user-event/ with Testing
        # Library's user-event, in the page; tests/dom-locators/ queries, waits
        # and acts with dom-locators, in the page. `mode: fast` runs them in
        # the plugin's fast mode (`VITEST_PLUGIN_RSC_MODE=fast`): see its
        # README.md. Fidelity mode, the default, has `watchDom` on too, as it
        # gives up nothing: the ratio of the two modes is of the other speed
        # features. Vitest runs on Bun, `bun --bun vitest`, which starts a run
        # 2 to 3 s sooner than `pnpm exec vitest` on Node.js; the tests then
        # take the same time. See the playgrounds' README.md. `node` runs it on
        # Node.js instead, in production only: the same tests, to compare.
        # `dom` runs them without a browser, in the Node host: a worker with
        # the DOM of happy-dom or jsdom (`VITEST_DOM`), happy-dom on Bun and
        # on Node.js, jsdom on Node.js only, as Vitest's environment of jsdom
        # does not start on Bun. In production and fast mode only: the
        # columns to hold against Chromium's in fast mode, each run 20 to
        # 40 s on a runner. `workers` runs the production run once for each
        # number of workers, in order, the first with Vite's dependencies to
        # optimize. `count` is the count of tests a run has to end with:
        # happy-dom skips the tests of its known gaps, `knownGaps` in the
        # app's vitest.config.ts.
        include:
          - { app: vitest-vs-playwright, tests: vitest }
          - { app: vitest-vs-playwright-notes, tests: vitest }
          - { app: vitest-vs-playwright-notes, tests: vitest-user-event }
          - { app: vitest-vs-playwright-notes, tests: dom-locators, mode: fast }
          - { app: vitest-vs-playwright-notes, tests: vitest-user-event, mode: fast }
          - { app: vitest-vs-playwright-notes, tests: vitest-user-event, mode: fast, node: true }
          - {
              app: vitest-vs-playwright-notes,
              tests: dom-locators,
              mode: fast,
              dom: happy-dom,
              workers: "1 4",
              count: "496 passed | 4 skipped (500)",
            }
          - {
              app: vitest-vs-playwright-notes,
              tests: dom-locators,
              mode: fast,
              node: true,
              dom: happy-dom,
              count: "496 passed | 4 skipped (500)",
            }
          - {
              app: vitest-vs-playwright-notes,
              tests: dom-locators,
              mode: fast,
              node: true,
              dom: jsdom,
              count: "500 passed (500)",
            }
    defaults:
      run:
        working-directory: playground/${{ matrix.app }}
    env:
      VITEST_PLUGIN_RSC_MODE: ${{ matrix.mode || 'fidelity' }}
      VITEST_DOM: ${{ matrix.dom }}
      # The first cells of the job's rows in the table of the job `summary`:
      # the app, the runner, the tests, the page's host and its DOM.
      COLUMN: "${{ matrix.app }} | Vitest on ${{ matrix.node && 'Node.js' || 'Bun' }} | ${{ matrix.tests }} | ${{ matrix.dom && 'Node host' || 'Chromium' }} | ${{ matrix.dom || 'Chromium' }}"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: ${{ !matrix.node }}
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        if: ${{ !matrix.dom }}
      - run: pnpm --filter vitest-plugin-rsc build
      # The benchmark's own checks, outside the columns of 500: that the
      # helpers of the tests do what the app does.
      - name: Check the benchmark
        if: ${{ matrix.app == 'vitest-vs-playwright-notes' && matrix.tests == 'vitest' }}
        run: bun --bun vitest run --configLoader native --maxWorkers 1 tests/zz-checks/
      - name: Run the tests, Next and React in production
        env:
          COUNT: ${{ matrix.count }}
        run: |
          {
            echo "### Vitest on ${{ matrix.node && 'Node.js' || 'Bun' }}, production, ${{ matrix.app }}, ${{ matrix.tests }}${{ matrix.mode == 'fast' && ', fast mode' || '' }}${{ matrix.dom && format(', in the Node host with {0}', matrix.dom) || ', in Chromium' }}"
            echo
            echo "| Step | Workers | Seconds |"
            echo "| --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          for workers in ${{ matrix.workers || '1' }}; do
            start=$(date +%s.%N)
            ${{ matrix.node && 'pnpm exec vitest run' || 'bun --bun vitest run --configLoader native' }} --maxWorkers "$workers" "tests/${{ matrix.tests }}/" | tee vitest.log
            end=$(date +%s.%N)
            log=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log)
            tests=$(grep -oP 'Tests\s+\K[0-9]+ passed' <<< "$log")
            count=$(grep -oP 'Tests\s+\K.*\(\d+\)' <<< "$log")
            duration=$(grep -oP 'Duration\s+\K[0-9.]+' <<< "$log")
            wall=$(echo "$end - $start" | bc)
            {
              printf "| %s tests, all included | %s | %.1f |\n" "$tests" "$workers" "$wall"
              printf "| Of which Vitest's own Duration | %s | %.1f |\n" "$workers" "$duration"
            } >> "$GITHUB_STEP_SUMMARY"
            printf "| %s | production | %s | %s | %s | %.1f | %.1f |\n" "$COLUMN" "$VITEST_PLUGIN_RSC_MODE" \
              "$workers" "${count// |/,}" "$wall" "$duration" >> "$RUNNER_TEMP/columns.md"
            if [[ -n "$COUNT" && "$count" != "$COUNT" ]]; then
              echo "::error::Vitest counted $count, where the column has $COUNT"
              exit 1
            fi
            if [[ "$workers" == 1 ]]; then
              echo "VITEST_SECONDS_${{ matrix.mode == 'fast' && 'FAST' || 'FIDELITY' }}_PRODUCTION=$duration" >> "$GITHUB_ENV"
            fi
          done
      - name: Run the tests, Next and React in development
        if: ${{ !matrix.node && !matrix.dom }}
        env:
          VITEST_PLUGIN_RSC_BUILD: development
        run: |
          start=$(date +%s.%N)
          bun --bun vitest run --configLoader native --maxWorkers 1 "tests/${{ matrix.tests }}/" | tee vitest.log
          end=$(date +%s.%N)
          log=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log)
          tests=$(grep -oP 'Tests\s+\K[0-9]+ passed' <<< "$log")
          duration=$(grep -oP 'Duration\s+\K[0-9.]+' <<< "$log")
          {
            echo "### Vitest on Bun, development, ${{ matrix.app }}, ${{ matrix.tests }}${{ matrix.mode == 'fast' && ', fast mode' || '' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| %s tests, 1 worker, all included | %.1f |\n" "$tests" "$(echo "$end - $start" | bc)"
            printf "| Of which Vitest's own Duration | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
          printf "| %s | development | %s | 1 | %s | %.1f | %.1f |\n" "$COLUMN" "$VITEST_PLUGIN_RSC_MODE" "$tests" \
            "$(echo "$end - $start" | bc)" "$duration" >> "$RUNNER_TEMP/columns.md"
          echo "VITEST_SECONDS_${{ matrix.mode == 'fast' && 'FAST' || 'FIDELITY' }}_DEVELOPMENT=$duration" >> "$GITHUB_ENV"
      # The job of fast mode runs the tests in fidelity mode too, on the
      # same runner: the ratio of the two is what fast mode gains, which the
      # times of two runners, a minute apart and of other machines, hide.
      - name: Run the tests in fidelity mode, Next and React in production
        if: matrix.mode == 'fast' && !matrix.node && !matrix.dom
        env:
          VITEST_PLUGIN_RSC_MODE: fidelity
        run: |
          start=$(date +%s.%N)
          bun --bun vitest run --configLoader native --maxWorkers 1 "tests/${{ matrix.tests }}/" | tee vitest.log
          end=$(date +%s.%N)
          log=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log)
          tests=$(grep -oP 'Tests\s+\K[0-9]+ passed' <<< "$log")
          duration=$(grep -oP 'Duration\s+\K[0-9.]+' <<< "$log")
          {
            echo "### Vitest on Bun, production, ${{ matrix.app }}, ${{ matrix.tests }}, fidelity mode, on the runner of fast mode"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| %s tests, 1 worker, all included | %.1f |\n" "$tests" "$(echo "$end - $start" | bc)"
            printf "| Of which Vitest's own Duration | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
          printf "| %s | production | fidelity | 1 | %s | %.1f | %.1f |\n" "$COLUMN" "$tests" \
            "$(echo "$end - $start" | bc)" "$duration" >> "$RUNNER_TEMP/columns.md"
          echo "VITEST_SECONDS_FIDELITY_PRODUCTION=$duration" >> "$GITHUB_ENV"
      - name: Run the tests in fidelity mode, Next and React in development
        if: matrix.mode == 'fast' && !matrix.node && !matrix.dom
        env:
          VITEST_PLUGIN_RSC_MODE: fidelity
          VITEST_PLUGIN_RSC_BUILD: development
        run: |
          start=$(date +%s.%N)
          bun --bun vitest run --configLoader native --maxWorkers 1 "tests/${{ matrix.tests }}/" | tee vitest.log
          end=$(date +%s.%N)
          log=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log)
          tests=$(grep -oP 'Tests\s+\K[0-9]+ passed' <<< "$log")
          duration=$(grep -oP 'Duration\s+\K[0-9.]+' <<< "$log")
          {
            echo "### Vitest on Bun, development, ${{ matrix.app }}, ${{ matrix.tests }}, fidelity mode, on the runner of fast mode"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| %s tests, 1 worker, all included | %.1f |\n" "$tests" "$(echo "$end - $start" | bc)"
            printf "| Of which Vitest's own Duration | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
          printf "| %s | development | fidelity | 1 | %s | %.1f | %.1f |\n" "$COLUMN" "$tests" \
            "$(echo "$end - $start" | bc)" "$duration" >> "$RUNNER_TEMP/columns.md"
          echo "VITEST_SECONDS_FIDELITY_DEVELOPMENT=$duration" >> "$GITHUB_ENV"
      - name: Compare fidelity mode with fast mode
        if: matrix.mode == 'fast' && !matrix.node && !matrix.dom
        run: |
          {
            echo "### Vitest on Bun, ${{ matrix.app }}, ${{ matrix.tests }}, fidelity mode and fast mode on one runner"
            echo
            echo "| Next and React | Fidelity mode, seconds | Fast mode, seconds | Fidelity / fast |"
            echo "| --- | ---: | ---: | ---: |"
            for build in production development; do
              fidelity="VITEST_SECONDS_FIDELITY_${build^^}"
              fast="VITEST_SECONDS_FAST_${build^^}"
              printf "| %s | %.1f | %.1f | %.2f |\n" "$build" "${!fidelity}" "${!fast}" \
                "$(echo "${!fidelity} / ${!fast}" | bc -l)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: columns-vitest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/columns.md
          if-no-files-found: ignore

  # Where the time of fast mode goes: a CPU profile of the page for every
  # test file, summed up by package in the summary of the run, a trace of
  # Chrome for two files, summed up by what the browser did, and both as an
  # artifact, to open in Chrome's DevTools.
  # Vitest on Node.js, here and in the primitives below, unlike the vitest
  # job: their numbers, the startup of the primitives too, compare with
  # earlier runs.
  profile:
    name: Vitest, vitest-vs-playwright-notes, vitest-user-event, fast mode, CPU profile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/vitest-vs-playwright-notes
    env:
      VITEST_PLUGIN_RSC_MODE: fast
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter vitest-plugin-rsc build
      - name: Run the tests with a CPU profile of the page
        run: pnpm exec vitest run --configLoader native -c vitest.profile.config.ts --maxWorkers 1 tests/vitest-user-event/
      - name: Sum up the profiles
        run: python3 test/profile-summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sum up the timings of the requests
        run: python3 test/timings-summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Trace Chrome for two test files
        env:
          VITEST_PROFILE: trace
        run: >-
          pnpm exec vitest run --configLoader native -c vitest.profile.config.ts --maxWorkers 1
          tests/vitest-user-event/note-create.test.tsx
          tests/vitest-user-event/flow-edit-chain.test.tsx
      - name: Sum up the traces
        run: python3 test/trace-summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-profiles-and-traces
          path: |
            playground/vitest-vs-playwright-notes/profiles/
            playground/vitest-vs-playwright-notes/timings/
            playground/vitest-vs-playwright-notes/traces/

  # The benchmark of primitives (vitest.bench.config.ts, bench/ of the notes
  # app): startup, a page load, a navigation, a Server Action, each kind of
  # event, a wait, a query and the database, each timed a hundred times, in
  # fast mode and in fidelity mode on one runner. Their tables and the two
  # side by side go to the summary of the run, the JSON to an artifact, for
  # bench/compare.py against another commit.
  primitives:
    name: Vitest, vitest-vs-playwright-notes, primitives, fast and fidelity mode
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/vitest-vs-playwright-notes
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter vitest-plugin-rsc build
      - name: Time the primitives in fast mode
        env:
          VITEST_PLUGIN_RSC_MODE: fast
        run: |
          BENCH_SHELL_START=$(date +%s%3N) pnpm exec vitest run --configLoader native -c vitest.bench.config.ts --maxWorkers 1
          cat bench-results/fast.md >> "$GITHUB_STEP_SUMMARY"
      - name: Time the primitives in fidelity mode
        env:
          VITEST_PLUGIN_RSC_MODE: fidelity
        run: |
          BENCH_SHELL_START=$(date +%s%3N) pnpm exec vitest run --configLoader native -c vitest.bench.config.ts --maxWorkers 1
          cat bench-results/fidelity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare fidelity mode with fast mode
        run: |
          {
            echo "### Primitives, fidelity mode and fast mode on one runner"
            echo
            python3 bench/compare.py bench-results/fidelity.json bench-results/fast.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: primitives
          path: playground/vitest-vs-playwright-notes/bench-results/

  playwright:
    name: Playwright, ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [vitest-vs-playwright, vitest-vs-playwright-notes]
    defaults:
      run:
        working-directory: playground/${{ matrix.app }}
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Next's test mode, for `next build` too: see playwright.config.ts.
      __NEXT_TEST_MODE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Start Postgres in Docker, in RAM
        run: |
          start=$(date +%s.%N)
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql/data \
            postgres:17 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          until docker exec postgres pg_isready -U postgres -h localhost; do sleep 0.2; done
          end=$(date +%s.%N)
          echo "DATABASE_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
      - name: Run the tests against next dev
        env:
          PLAYWRIGHT_SERVER: dev
        run: |
          start=$(date +%s.%N)
          pnpm exec playwright test | tee playwright.log
          end=$(date +%s.%N)
          tests=$(grep -oP '[0-9]+(?= passed)' playwright.log)
          duration=$(grep -oP 'passed \(\K[0-9.]+(?:m|s)' playwright.log)
          {
            echo "### Playwright, development, ${{ matrix.app }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| Postgres in Docker | %.1f |\n" "$DATABASE_SECONDS"
            printf "| %s tests, 1 worker, \`next dev\` included | %.1f |\n" "$tests" "$(echo "$end - $start" | bc)"
            echo "| Of which Playwright's own time | $duration |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf "| %s | Playwright | playwright | Chromium | Chromium | development | | 1 | %s passed | %.1f | %.1f |\n" \
            "${{ matrix.app }}" "$tests" "$(echo "$end - $start" | bc)" \
            "$(awk '/m$/ { print $0 * 60; next } { print $0 + 0 }' <<< "$duration")" >> "$RUNNER_TEMP/columns.md"
      - name: Build the app with next build
        run: |
          start=$(date +%s.%N)
          pnpm build
          end=$(date +%s.%N)
          echo "BUILD_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
      - name: Run the tests against next start
        run: |
          start=$(date +%s.%N)
          pnpm exec playwright test | tee playwright.log
          end=$(date +%s.%N)
          tests=$(grep -oP '[0-9]+(?= passed)' playwright.log)
          duration=$(grep -oP 'passed \(\K[0-9.]+(?:m|s)' playwright.log)
          {
            echo "### Playwright, production, ${{ matrix.app }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| \`next build\` | %.1f |\n" "$BUILD_SECONDS"
            printf "| %s tests, 1 worker, \`next start\` included | %.1f |\n" "$tests" "$(echo "$end - $start" | bc)"
            echo "| Of which Playwright's own time | $duration |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf "| %s | Playwright | playwright | Chromium | Chromium | production | | 1 | %s passed | %.1f | %.1f |\n" \
            "${{ matrix.app }}" "$tests" "$(echo "$end - $start" | bc)" \
            "$(awk '/m$/ { print $0 * 60; next } { print $0 + 0 }' <<< "$duration")" >> "$RUNNER_TEMP/columns.md"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: columns-playwright-${{ strategy.job-index }}
          path: ${{ runner.temp }}/columns.md
          if-no-files-found: ignore

  # Every run of the jobs vitest and playwright in one table per app, from
  # the rows they write to their artifacts `columns-*`: production first,
  # then by workers, the fastest first. The host is where the page runs,
  # Chromium or the Node host, a worker of Vitest; the DOM is Chromium's,
  # happy-dom or jsdom. The seconds all included are the command's: the
  # runner's startup, Vite's optimization of the dependencies, `next dev`
  # or `next start` in them, `next build` not.
  summary:
    name: Every run in one table
    needs: [vitest, playwright]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: columns-*
          path: columns
      - name: Put the rows in one table per app
        run: |
          for app in vitest-vs-playwright-notes vitest-vs-playwright; do
            {
              echo "### Every run, $app"
              echo
              echo "| Runner | Tests | Host | DOM | Next and React | Mode | Workers | Tests counted | Seconds, all included | Of which the runner's own |"
              echo "| --- | --- | --- | --- | --- | --- | ---: | --- | ---: | ---: |"
              { grep -h "^| $app |" columns/*/columns.md || true; } \
                | sed "s/^| $app //" \
                | sort -t "|" -k 6,6r -k 8,8n -k 10,10n
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
