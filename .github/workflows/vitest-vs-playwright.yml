name: Vitest vs Playwright

# The same 25 tests of the notes demo, in 5 files, once in Vitest with
# `renderServer()` and once in Playwright against `next start` and a Postgres
# in Docker: see playground/nextjs-notes-demo/speed/README.md. Each job writes
# what each of its steps took to the summary of the run.
on:
  pull_request:
    paths:
      - playground/nextjs-notes-demo/**
      - .github/workflows/vitest-vs-playwright.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# With pipefail, so that a test that fails fails the step, through `tee`.
defaults:
  run:
    shell: bash

env:
  # The same workers for both: the 4 cores of a runner.
  WORKERS: 4

jobs:
  vitest:
    name: Vitest (renderServer, production build of Next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - name: Run the 25 tests
        env:
          # Next's production code, as `next build` makes it.
          VITEST_PLUGIN_RSC_BUILD: production
        run: |
          start=$(date +%s.%N)
          # The config of the notes demo alone, not the root one with every
          # project of the repo.
          pnpm exec vitest run --configLoader runner --config playground/nextjs-notes-demo/vitest.config.ts \
            --project nextjs-notes-demo-browser --maxWorkers "$WORKERS" speed/vitest | tee vitest.log
          end=$(date +%s.%N)
          # Vitest's own measure, without the load of the config.
          duration=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -oP 'Duration\s+\K[0-9.]+')
          {
            echo "### Vitest"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| Database (PGlite in the page) | 0 |\n"
            printf "| Build of the app | 0 |\n"
            printf "| 25 tests, %s workers, \`isolate: false\`, the load of the config included | %.1f |\n" "$WORKERS" "$(echo "$end - $start" | bc)"
            printf "| Of which Vitest's own Duration | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"

  playwright:
    name: Playwright (next build, next start, Postgres in Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: playground/nextjs-notes-demo
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SUPPORT_EMAIL: support@notes.example
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Start Postgres in Docker and push the schema
        run: |
          start=$(date +%s.%N)
          # In RAM, without the waits for the disk: the fastest Postgres for
          # tests, as PGlite is in memory for the Vitest tests.
          docker run -d --name notes-demo-postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql/data \
            postgres:17 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          until docker exec notes-demo-postgres pg_isready -U postgres -h localhost; do sleep 0.2; done
          pnpm db:push --force
          end=$(date +%s.%N)
          echo "DATABASE_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
      - name: Build the app with next build
        run: |
          start=$(date +%s.%N)
          pnpm build
          end=$(date +%s.%N)
          echo "BUILD_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
      - name: Run the 25 tests
        run: |
          start=$(date +%s.%N)
          pnpm exec playwright test --workers "$WORKERS" | tee playwright.log
          end=$(date +%s.%N)
          # Playwright's own measure, the tests after `next start` is up.
          duration=$(grep -oP 'passed \(\K[0-9.]+(?=s\))' playwright.log)
          {
            echo "### Playwright"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            printf "| Database (Postgres in Docker, \`db:push\`) | %.1f |\n" "$DATABASE_SECONDS"
            printf "| Build of the app (\`next build\`) | %.1f |\n" "$BUILD_SECONDS"
            printf "| 25 tests, %s workers, \`next start\` included | %.1f |\n" "$WORKERS" "$(echo "$end - $start" | bc)"
            printf "| Of which Playwright's own time | %.1f |\n" "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: playground/nextjs-notes-demo/test-results/
