name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.repository == 'storybookjs/vitest-plugin-rsc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/vitest-plugin-rsc--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/vitest-plugin-rsc--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.PAT_STORYBOOK_BOT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # pnpm, and npm, which publishes with provenance, run on Node.js.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      # The build runs on Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: npm install -g npm@^11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --dry-run
        working-directory: packages/vitest-plugin-rsc
      # A prerelease, like 0.4.0-alpha.1, goes to the dist-tag of its kind,
      # `alpha`, so that `npm install vitest-plugin-rsc` keeps the last
      # release that is none. Every other release goes to `latest`.
      - id: dist-tag
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
            *) tag=latest ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        working-directory: packages/vitest-plugin-rsc
      - run: npm publish --tag "${{ steps.dist-tag.outputs.tag }}" --access public --provenance
        working-directory: packages/vitest-plugin-rsc
