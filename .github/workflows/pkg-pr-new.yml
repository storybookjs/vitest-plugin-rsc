name: Preview Package

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'storybookjs/vitest-plugin-rsc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # pnpm, and the lifecycle scripts of the install, run on Node.js: Bun is not pnpm's runtime.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `--no-compact`, as compact is the default. A compact URL names no
      # repository: pkg.pr.new looks it up in the `repository` of the package
      # on npm, and pkg-pr-new checks only that there is one. On npm,
      # `@storybook/nextjs-vite-rsc` is so far the canaries of
      # storybookjs/storybook#32412, so its compact URL would look there.
      - run: >-
          pnpm dlx pkg-pr-new publish --no-compact --no-template --pnpm
          --comment=update --commentWithDev --packageManager=pnpm
          packages/vitest-plugin-rsc packages/storybook-nextjs-vite-rsc
