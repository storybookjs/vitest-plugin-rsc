name: Benchmark A/B

# The same tests on two or more refs, interleaved on one runner (A, B, A,
# B, ...), so the refs compare on the same machine; several copies of the
# job give more samples. Each copy writes a table of medians and the ratio
# of each ref to the first to the summary of the run, and uploads the logs
# and, with a profile, the timings or CPU profiles of every run.
#
# Runs on a push to a branch `exp/<name>`, with the settings of
# `.github/bench-ab.json` on that branch (every key optional):
#
#   { "refs": ["kasper/some-branch", "HEAD"], "tests": "tests/vitest-user-event/",
#     "reps": 3, "copies": [1, 2], "mode": "fast", "runtime": "bun",
#     "build": "production", "profile": "timings", "app": "vitest-vs-playwright-notes" }
#
# "runtime", the default, "bun", runs Vitest on Bun, `bun --bun vitest run
# --configLoader native`, for every ref; "node" on Node.js, with
# `pnpm exec vitest run`. A list, one runtime per ref, runs each ref on its
# own: `"refs": ["HEAD", "HEAD"], "runtime": ["node", "bun"]` compares Node.js
# with Bun on one runner, and the table has a row per ref and runtime.
#
# "HEAD" is the pushed commit. Or on demand, with the same settings as
# inputs, once the workflow is on the default branch.
on:
  push:
    branches: ["exp/**"]
  workflow_dispatch:
    inputs:
      refs:
        description: "Refs to compare, comma-separated; the first is the baseline"
        type: string
      app:
        description: "Playground"
        type: string
      tests:
        description: "Test files or directory, passed to vitest"
        type: string
      mode:
        description: "The mode (VITEST_PLUGIN_RSC_MODE): fast or fidelity"
        type: string
      runtime:
        description: "The runtime of Vitest: bun (the default) or node, or one per ref, comma-separated"
        type: string
      build:
        description: "Next and React build: production or development"
        type: string
      reps:
        description: "Rounds per copy of the job, each ref once per round"
        type: string
      copies:
        description: "Parallel copies of the job, as a JSON list"
        type: string
      profile:
        description: "none, timings or profile (vitest.profile.config.ts)"
        type: string

defaults:
  run:
    shell: bash

jobs:
  settings:
    name: Settings
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.merge.outputs.refs }}
      app: ${{ steps.merge.outputs.app }}
      tests: ${{ steps.merge.outputs.tests }}
      mode: ${{ steps.merge.outputs.mode }}
      runtime: ${{ steps.merge.outputs.runtime }}
      build: ${{ steps.merge.outputs.build }}
      reps: ${{ steps.merge.outputs.reps }}
      copies: ${{ steps.merge.outputs.copies }}
      profile: ${{ steps.merge.outputs.profile }}
    steps:
      - uses: actions/checkout@v6
      - id: merge
        env:
          IN_REFS: ${{ inputs.refs }}
          IN_APP: ${{ inputs.app }}
          IN_TESTS: ${{ inputs.tests }}
          IN_MODE: ${{ inputs.mode }}
          IN_RUNTIME: ${{ inputs.runtime }}
          IN_BUILD: ${{ inputs.build }}
          IN_REPS: ${{ inputs.reps }}
          IN_COPIES: ${{ inputs.copies }}
          IN_PROFILE: ${{ inputs.profile }}
        run: |
          file=.github/bench-ab.json
          [ -f "$file" ] || file=/dev/null
          get() { jq -r --arg key "$1" --arg fallback "$2" 'if type == "object" and has($key) then (.[$key] | if type == "array" then join(",") else tostring end) else $fallback end' "$file" 2>/dev/null || echo "$2"; }
          refs=${IN_REFS:-$(get refs "HEAD")}
          refs=${refs//HEAD/${{ github.sha }}}
          copies=${IN_COPIES:-$(jq -c '.copies // [1]' "$file" 2>/dev/null || echo "[1]")}
          # One runtime for every ref, or one per ref: a list as long as refs.
          IFS=, read -ra runtimes <<< "${IN_RUNTIME:-$(get runtime bun)}"
          IFS=, read -ra ref_list <<< "$refs"
          for runtime in "${runtimes[@]}"; do
            case "$runtime" in node | bun) ;; *) echo "::error::runtime is node or bun, not $runtime"; exit 1 ;; esac
          done
          if [ "${#runtimes[@]}" = 1 ]; then
            for _ in "${ref_list[@]:1}"; do runtimes+=("${runtimes[0]}"); done
          elif [ "${#runtimes[@]}" != "${#ref_list[@]}" ]; then
            echo "::error::runtime has ${#runtimes[@]} values for ${#ref_list[@]} refs"
            exit 1
          fi
          runtime=$(IFS=,; echo "${runtimes[*]}")
          {
            echo "refs=$refs"
            echo "app=${IN_APP:-$(get app vitest-vs-playwright-notes)}"
            echo "tests=${IN_TESTS:-$(get tests tests/vitest-user-event/)}"
            echo "mode=${IN_MODE:-$(get mode fast)}"
            echo "runtime=$runtime"
            echo "build=${IN_BUILD:-$(get build production)}"
            echo "reps=${IN_REPS:-$(get reps 3)}"
            echo "copies=$copies"
            echo "profile=${IN_PROFILE:-$(get profile none)}"
          } | tee -a "$GITHUB_OUTPUT"
  ab:
    name: A/B ${{ needs.settings.outputs.refs }} (${{ matrix.copy }})
    needs: settings
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(needs.settings.outputs.copies) }}
    env:
      VITEST_PLUGIN_RSC_MODE: ${{ needs.settings.outputs.mode }}
      RUNTIME: ${{ needs.settings.outputs.runtime }}
      VITEST_PLUGIN_RSC_BUILD: ${{ needs.settings.outputs.build }}
      REFS: ${{ needs.settings.outputs.refs }}
      APP: ${{ needs.settings.outputs.app }}
      TESTS: ${{ needs.settings.outputs.tests }}
      REPS: ${{ needs.settings.outputs.reps }}
      PROFILE: ${{ needs.settings.outputs.profile }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: contains(needs.settings.outputs.runtime, 'bun')
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Check out and build every ref
        run: |
          mkdir -p .bench-ab
          i=0
          IFS=, read -ra refs <<< "$REFS"
          for ref in "${refs[@]}"; do
            i=$((i + 1))
            git fetch --quiet origin "$ref" || true
            git worktree add --quiet "../wt$i" "$(git rev-parse --verify "$ref^{commit}" 2>/dev/null || git rev-parse --verify "origin/$ref^{commit}")"
            echo "ref $i: $ref = $(git -C "../wt$i" rev-parse --short HEAD)"
            (cd "../wt$i" && pnpm install --frozen-lockfile --silent && pnpm --filter vitest-plugin-rsc build > /dev/null)
          done
          echo "$i" > .bench-ab/count
      - name: Run the rounds, interleaved
        run: |
          IFS=, read -ra refs <<< "$REFS"
          count=$(cat .bench-ab/count)
          mkdir -p .bench-ab/logs
          config=""
          if [ "$PROFILE" != none ]; then config="-c vitest.profile.config.ts"; fi
          if [ "$PROFILE" = timings ]; then export VITEST_PROFILE=timings; fi
          IFS=, read -ra runtimes <<< "$RUNTIME"
          # Vitest of the i-th ref, on its runtime.
          run_vitest() {
            if [ "${runtimes[$(($1 - 1))]}" = bun ]; then
              bun --bun vitest run --configLoader native "${@:2}"
            else
              pnpm exec vitest run "${@:2}"
            fi
          }
          # A warm-up of each ref: the dependency optimizer and the caches.
          for i in $(seq 1 "$count"); do
            (cd "../wt$i/playground/$APP" && run_vitest "$i" --maxWorkers 1 $TESTS > /dev/null 2>&1 || true)
          done
          echo -e "round\tpair\tref\truntime\twall_s\tduration_s\tfiles_ms\ttests" > .bench-ab/results.tsv
          for r in $(seq 1 "$REPS"); do
            for i in $(seq 1 "$count"); do
              dir="../wt$i/playground/$APP"
              rm -rf "$dir/timings" "$dir/profiles"
              log="$GITHUB_WORKSPACE/.bench-ab/logs/r$r-ref$i.log"
              start=$(date +%s.%N)
              (cd "$dir" && run_vitest "$i" $config --maxWorkers 1 $TESTS 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > "$log") || true
              wall=$(echo "$(date +%s.%N) - $start" | bc)
              duration=$(grep -oP 'Duration\s+\K[0-9.]+' "$log" | tail -1)
              tests=$(grep -oP 'Tests\s+\K[0-9]+ passed' "$log" | tail -1)
              # The sum of the files' own times, from the tree reporter's lines.
              files=$(grep -oP '\(\d+ tests?\) \K[0-9]+(?=ms)' "$log" | paste -sd+ | bc)
              echo -e "$r\t$i\t${refs[$((i - 1))]}\t${runtimes[$((i - 1))]}\t$wall\t${duration:-nan}\t${files:-nan}\t${tests:-failed}" >> .bench-ab/results.tsv
              if [ "$PROFILE" != none ]; then
                mkdir -p "$GITHUB_WORKSPACE/.bench-ab/prof/r$r-ref$i"
                cp -r "$dir/timings" "$GITHUB_WORKSPACE/.bench-ab/prof/r$r-ref$i/" 2>/dev/null || true
                cp -r "$dir/profiles" "$GITHUB_WORKSPACE/.bench-ab/prof/r$r-ref$i/" 2>/dev/null || true
              fi
            done
          done
          cat .bench-ab/results.tsv
      - name: Sum up
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, statistics
          rows = list(csv.DictReader(open(".bench-ab/results.tsv"), delimiter="\t"))
          # A row of the table per ref and runtime, in the order of the refs.
          pairs = []
          for row in rows:
              if row["pair"] not in pairs:
                  pairs.append(row["pair"])
          def of(pair):
              return [r for r in rows if r["pair"] == pair]
          def med(pair, key):
              values = [float(r[key]) for r in of(pair) if r[key] != "nan"]
              return statistics.median(values) if values else float("nan")
          runtime = {"bun": "Bun", "node": "Node.js"}
          import os
          print(f"### A/B copy ${{ matrix.copy }}: {os.environ['APP']} {os.environ['TESTS']}, {os.environ['VITEST_PLUGIN_RSC_MODE']} mode, {os.environ['VITEST_PLUGIN_RSC_BUILD']}, {len(rows) // max(len(pairs), 1)} rounds\n")
          # Wall: the whole command, the start of the runtime and of Vitest
          # too, which Vitest's own Duration leaves out.
          print("| Ref | Vitest on | Wall, median s | Duration, median s | Files' time, median s | Files vs first | Wall vs first | Rounds (Wall s) | Tests |")
          print("| --- | --- | ---: | ---: | ---: | ---: | ---: | --- | --- |")
          base, base_wall = med(pairs[0], "files_ms"), med(pairs[0], "wall_s")
          for pair in pairs:
              w, d, f = med(pair, "wall_s"), med(pair, "duration_s"), med(pair, "files_ms")
              rounds = ", ".join(f"{float(r['wall_s']):.1f}" for r in of(pair))
              tests = ", ".join(sorted({r["tests"] for r in of(pair)}))
              first = of(pair)[0]
              print(f"| `{first['ref']}` | {runtime[first['runtime']]} | {w:.1f} | {d:.1f} | {f / 1000:.1f} | {100 * (f - base) / base:+.1f}% | {100 * (w - base_wall) / base_wall:+.1f}% | {rounds} | {tests} |")
          EOF
          if [ "$PROFILE" = timings ]; then
            for d in .bench-ab/prof/r1-ref*; do
              [ -d "$d/timings" ] || continue
              echo "### Timings of $(basename "$d")" >> "$GITHUB_STEP_SUMMARY"
              (cd "../wt1/playground/$APP" && python3 test/timings-summary.py "$GITHUB_WORKSPACE/$d/timings") >> "$GITHUB_STEP_SUMMARY" || true
            done
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-ab-${{ matrix.copy }}
          path: |
            .bench-ab/logs
            .bench-ab/results.tsv
            .bench-ab/prof
          if-no-files-found: ignore
