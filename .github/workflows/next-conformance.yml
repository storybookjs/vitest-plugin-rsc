name: Next.js conformance

# Runs fixtures of Next's own e2e tests against the plugin, see
# docs/internals/next-conformance.md. Not a part of CI, and not run on a pull
# request: it takes its time, it fetches from vercel/next.js, and with a
# run per pull request the runs take the runners of every other job. It runs
# on main when the runner, the plugin or the lockfile changes, by hand, and
# once a week against the canary of Next.js, to tell early when Next changes
# what the plugin relies on.
on:
  workflow_dispatch:
    inputs:
      next:
        description: The Next.js to run, like `canary` or `16.5.0`. Empty for the pinned one.
        required: false
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - "conformance/**"
      - ".github/workflows/next-conformance.yml"
      # What the fixtures run: the plugin, and the Next, Vite and Vitest of
      # the lockfile.
      - "packages/vitest-plugin-rsc/src/**"
      - "!packages/vitest-plugin-rsc/src/**/*.test.ts"
      - "packages/vitest-plugin-rsc/package.json"
      - "pnpm-lock.yaml"

# One run of main at a time: the newer push is what counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Next.js ${{ inputs.next || (github.event_name == 'schedule' && 'canary') || 'pinned' }}
    # A release of Release Please changes the plugin's package.json, and
    # nothing that the fixtures run.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT: ${{ inputs.next || (github.event_name == 'schedule' && 'canary') || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      # pnpm, and the lifecycle scripts of the install, run on Node.js: Bun is not pnpm's runtime.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter vitest-plugin-rsc build
      # The fixtures are fetched at the tag of the Next.js that is installed.
      # The expectations are of the pinned one: against another Next.js, what
      # differs is what the run is for. `@next/routing` is released with
      # `next`, under the same version.
      - name: Install Next.js ${{ env.NEXT }}
        if: env.NEXT != ''
        run: |
          pnpm --filter next-conformance add --config.minimum-release-age=0 "next@$NEXT" "@next/routing@$NEXT"
          pnpm --filter next-conformance exec bun -p "'next@' + require('next/package.json').version"
      - run: bunx --bun playwright install --with-deps --only-shell chromium
      - run: pnpm --filter next-conformance test
      - name: Run the fixtures
        run: |
          set -o pipefail
          # Two fixtures at a time: a runner has four cores, and a fixture is
          # a browser and a dev server.
          pnpm conformance --concurrency 2 | tee conformance.log
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            sed -n '/tests pass/,$p' conformance.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-conformance
          path: |
            conformance/.results
            conformance/.work/logs
          include-hidden-files: true
