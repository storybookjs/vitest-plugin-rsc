name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request of Release Please changes only versions and changelogs, so
# no job runs on it: they run on main once it merges. Every job says so with
# its own `if`, so that it reports as skipped, which a required check counts
# as passed; a workflow that does not start leaves the check pending.
jobs:
  format:
    name: Format (oxfmt)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint (oxlint)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:ci

  typecheck:
    name: Type Check (tsgo)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsgo

  build:
    name: Build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The projects of the root vitest.config.ts, in five parts. The Storybook
  # tests of the demos run `storybook dev`, `storybook build` and Chromium at
  # once; on one runner with the other projects they need more memory than it
  # has, and GitHub stops the runner. The longest test file of each demo, the
  # one that runs its `storybook dev`, is a project of its own, on a runner of
  # its own: they are CPU-bound, and set how long CI takes.
  vitest:
    name: Test (vitest, ${{ matrix.part }})
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: host demo Storybook
            projects: --project nextjs-host-demo-storybook
          - part: host demo
            projects: --project 'nextjs-host-demo*' --project '!nextjs-host-demo-storybook'
          - part: notes demo Storybook
            projects: --project nextjs-notes-demo-storybook
          - part: notes demo Storybook build and changes
            projects: --project 'nextjs-notes-demo-storybook*' --project '!nextjs-notes-demo-storybook'
          - part: other projects
            projects: --project '!nextjs-host-demo*' --project '!nextjs-notes-demo-storybook*'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - run: pnpm test:dist ${{ matrix.projects }}

  # The check that branch protection requires: it passes when every part of
  # the vitest job does.
  test:
    name: Test (vitest)
    if: ${{ always() && !startsWith(github.head_ref, 'release-please--') }}
    needs: vitest
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.vitest.result }}" = success

  # The app as `next start` runs it: see docs/internals/next-routes.md, "Development Or
  # Production".
  production:
    name: Test (production build)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - name: Test the Next.js playgrounds
        env:
          VITEST_PLUGIN_RSC_BUILD: production
        run: pnpm test:dist --project nextjs-e2e-demo --project nextjs-notes-demo-browser --project nextjs-notes-demo-stories --project nextjs-db-recipes

  next:
    name: Next.js ${{ matrix.next }}, ${{ matrix.build }}
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Test job runs the pinned Next.js. `latest` tells when a release
        # changes something of Next that the plugin calls, `canary` tells it
        # before the release.
        next: [latest, canary]
        # The `build` option of the plugin.
        build: [development, production]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm waits a day before it installs a new release; this job is for the
      # release the tag names now. The packages that go with `next` are at
      # the version of that release: while Next publishes one, their tags
      # name different releases for a moment.
      - name: Install Next.js ${{ matrix.next }}
        run: |
          version=$(npm view next@${{ matrix.next }} version)
          pnpm --filter nextjs-e2e-demo add --config.minimum-release-age=0 next@$version @next/routing@$version
          pnpm --filter nextjs-cache-components-demo add --config.minimum-release-age=0 next@$version @next/routing@$version
          pnpm --filter nextjs-notes-demo add --config.minimum-release-age=0 next@$version @next/env@$version @next/routing@$version
          pnpm --filter nextjs-db-recipes add --config.minimum-release-age=0 next@$version @next/routing@$version
          pnpm --filter nextjs-e2e-demo exec node -p "'next@' + require('next/package.json').version"
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - name: Test the Next.js playgrounds
        env:
          VITEST_PLUGIN_RSC_BUILD: ${{ matrix.build }}
        run: |
          pnpm test:dist \
            --project nextjs-e2e-demo \
            --project nextjs-cache-components-demo \
            --project nextjs-notes-demo-browser \
            --project nextjs-notes-demo-stories \
            --project nextjs-db-recipes
