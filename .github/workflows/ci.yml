name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format (oxfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:ci

  typecheck:
    name: Type Check (tsgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsgo

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - run: pnpm test:dist

  # The app as `next start` runs it: see docs/next-routes.md, "Development Or
  # Production".
  production:
    name: Test (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - name: Test the Next.js playgrounds
        env:
          VITEST_PLUGIN_RSC_BUILD: production
        run: pnpm test:dist --project nextjs-e2e-demo --project nextjs-notes-demo-browser

  next:
    name: Next.js ${{ matrix.next }}, ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Test job runs the pinned Next.js. `latest` tells when a release
        # changes something of Next that the plugin calls, `canary` tells it
        # before the release.
        next: [latest, canary]
        # The `build` option of the plugin.
        build: [development, production]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm waits a day before it installs a new release; this job is for the
      # release the tag names now. The packages that go with `next` are at
      # the version of that release: while Next publishes one, their tags
      # name different releases for a moment.
      - name: Install Next.js ${{ matrix.next }}
        run: |
          version=$(npm view next@${{ matrix.next }} version)
          pnpm --filter nextjs-e2e-demo add --config.minimum-release-age=0 next@$version @next/routing@$version
          pnpm --filter nextjs-notes-demo add --config.minimum-release-age=0 next@$version @next/env@$version @next/routing@$version
          pnpm --filter nextjs-e2e-demo exec node -p "'next@' + require('next/package.json').version"
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - name: Test the Next.js playgrounds
        env:
          VITEST_PLUGIN_RSC_BUILD: ${{ matrix.build }}
        run: |
          pnpm test:dist \
            --project nextjs-e2e-demo \
            --project nextjs-notes-demo-browser \
            --project nextjs-notes-demo-node
