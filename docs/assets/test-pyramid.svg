<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Test pyramid</title>
  <desc id="desc">
    A two-layer test pyramid with a smaller Playwright end-to-end layer above a wider Vitest unit,
    component, and integration layer.
  </desc>
  <defs>
    <style>
      .ui {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .label {
        fill: #111827;
        font-size: 25px;
        font-weight: 740;
      }

      .tool {
        fill: #475467;
        font-size: 19px;
        font-weight: 560;
      }

      .axis {
        fill: #667085;
        font-size: 16px;
        font-weight: 560;
      }

      .footer {
        fill: #667085;
        font-size: 18px;
        font-weight: 560;
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="419" rx="18" fill="#ffffff" stroke="#e5e7eb" />

  <g class="ui" transform="translate(126 36)">
    <path
      d="M354 0 L206 145 H502 Z"
      fill="#eef4ff"
      stroke="#98a2b3"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path
      d="M192 166 H516 L650 314 H58 Z"
      fill="#f3f8ef"
      stroke="#98a2b3"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <line x1="196" y1="155" x2="512" y2="155" stroke="#d0d5dd" stroke-width="2" />

    <text x="354" y="72" text-anchor="middle" class="label">E2E</text>
    <text x="354" y="104" text-anchor="middle" class="tool">Playwright</text>

    <text x="354" y="234" text-anchor="middle" class="label">Unit / Component / Integration</text>
    <text x="354" y="267" text-anchor="middle" class="tool">Vitest</text>
  </g>

  <g class="ui">
    <line x1="112" y1="60" x2="112" y2="336" stroke="#d0d5dd" stroke-width="2" />
    <path d="M112 50 L106 62 H118 Z" fill="#98a2b3" />
    <path d="M112 346 L106 334 H118 Z" fill="#98a2b3" />
    <text x="78" y="99" text-anchor="middle" class="axis" transform="rotate(-90 78 99)">
      higher confidence
    </text>
    <text x="78" y="309" text-anchor="middle" class="axis" transform="rotate(-90 78 309)">
      faster feedback
    </text>
  </g>

  <g class="ui">
    <text x="480" y="376" text-anchor="middle" class="footer">
      Most tests should fail in the fast layer.
    </text>
    <text x="480" y="400" text-anchor="middle" class="footer">
      E2E should cover fewer, higher-value paths.
    </text>
  </g>
</svg>
